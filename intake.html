<section class="section terms-page">
  <div class="wrap">
    <h1>Intake Form</h1>
    <p class="intake-sub">Fill this out and I'll review it and reach out to get you started.</p>

    <form class="intake-form" action="https://formspree.io/f/mdenolvr" method="POST">
      <input type="hidden" name="_subject" value="New SOVRYX Training Intake Submission">
      <input type="hidden" name="_next" value="https://sovryxtraining.com/thank-you.html">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="q1">What are your short term goals? (Achievable within 3-6 months)</label>
      <textarea id="q1" name="short_term_goals" rows="2" required></textarea>

      <label for="q2">What is your current height and weight?</label>
      <textarea id="q2" name="height_weight" rows="1" required></textarea>

      <label for="q3">What are your long term goals? (Achievable within 1-2 years)</label>
      <textarea id="q3" name="long_term_goals" rows="2" required></textarea>

      <label for="q4">Do you have any current injuries or limitations? (Any health concerns)</label>
      <textarea id="q4" name="injuries_limitations" rows="2" required></textarea>

      <label for="q5">Do you have any barriers that might inhibit progress? (e.g. work, friends/family, sleep, stress, diet problems)</label>
      <textarea id="q5" name="barriers" rows="2" required></textarea>

      <label for="q6">How many hours of sleep do you usually get per night?</label>
      <textarea id="q6" name="sleep_hours" rows="1" required></textarea>

      <label for="q7">Do you currently follow any specific nutrition plan or dietary style? (e.g. Keto, vegan, intermittent fasting)</label>
      <textarea id="q7" name="nutrition_style" rows="2" required></textarea>

      <label for="q8">Is your current lifestyle more active or sedentary?</label>
      <textarea id="q8" name="lifestyle" rows="1" required></textarea>

      <label for="q9">Do you track your food intake or calories/macros? If so, how?</label>
      <textarea id="q9" name="food_tracking" rows="2" required></textarea>

      <label for="q10">Where do you normally train? (In a gym, at home, outdoors, etc.) Also what time do you prefer to workout?</label>
      <textarea id="q10" name="training_location_time" rows="2" required></textarea>

      <label for="q11">Have you worked with a coach or personal trainer before? What did you like/dislike?</label>
      <textarea id="q11" name="past_coaching" rows="2" required></textarea>

      <label for="q12">What kind of coaching style do you think will work best for you? (e.g. strict, encouraging, flexible)</label>
      <textarea id="q12" name="coaching_style" rows="2" required></textarea>

      <label for="q13">What is your preferred method of contact?</label>
      <textarea id="q13" name="contact_method" rows="1" required></textarea>

      <label for="q14">What foods do you enjoy eating, and what foods do you dislike or want to avoid? (e.g. allergies, foods you refuse to eat, meals you could eat every day)</label>
      <textarea id="q14" name="food_preferences" rows="3" required></textarea>

      <label for="q15">What exercises or types of training do you enjoy most, and which ones do you dislike or want to avoid? (e.g. favorite lifts, cardio vs weights, anything that bothers your joints)</label>
      <textarea id="q15" name="exercise_preferences" rows="3" required></textarea>

      <button type="submit" class="btn btn-primary">Submit Intake</button>
    </form>
  </div>
</section>
